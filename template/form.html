<!doctype html>
<html lang="fr">
  <head><title>Freebox Config</title></head>
  <body>
    <h1>Configuration Freebox</h1>
    <form method="POST">
      <h2>Créer une nouvelle application</h2>
      <label>App ID: <input type="text" name="app_id"></label><br>
      <label>Nom: <input type="text" name="app_name"></label><br>
      <label>Version: <input type="text" name="app_version"></label><br>
      <label>Device: <input type="text" name="device_name"></label><br>
      <input type="submit" name="action" value="Créer App">

      <h2>Ou utiliser un app_token existant</h2>
      <label>App Token: <input type="text" name="app_token"></label><br>
      <input type="submit" name="action" value="Utiliser Token">
    </form>
  </body>
</html>
